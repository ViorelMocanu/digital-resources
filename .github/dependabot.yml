# Dependabot version updates. Options: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Every proposal waits until the release is seven days old, the same wait pnpm keeps on this machine
# (minimumReleaseAge in pnpm-workspace.yaml), so a bad or hijacked release has time to be noticed and withdrawn.
# The wait does not apply to security updates: GitHub proposes those at once, on its own.
#
# Only the dependencies named in package.json are proposed; what they bring along moves with them.

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'saturday'
    cooldown:
      default-days: 7
    groups:
      # One pull request a week for everything that stays inside its major version; a major comes on its own.
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    open-pull-requests-limit: 5
    assignees:
      - 'ViorelMocanu'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'saturday'
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    assignees:
      - 'ViorelMocanu'
