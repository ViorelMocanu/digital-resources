name: Pentest-Tools.com CLI Light Scan

on:
    # Runs on pushes targeting the default branch
    push:
      branches: ['main']

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:
      inputs:
        url:
          type: string
          description: The URL to scan
          required: true

# The scan reads the public site from outside; the workflow needs nothing from the repository beyond reading it.
permissions:
  contents: read

# One scan at a time; a scan in progress is left to finish.
concurrency:
  group: 'pentest-scan'
  cancel-in-progress: false

jobs:
  test_light_scan:
    runs-on: ubuntu-latest
    name: Run a light scan, no API key needed
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Actual PTT light test
        uses: pentesttoolscom/pentesttools-github-action@ece54ee3353e11194715688b9af3b708801fa3f6 # master on 2026-02-03
        id: ptt
        with:
          target: ${{ steps.deployment.outputs.page_url || 'https://resurse.dev' }}
          format: text
          fail: medium
      - name: Check the light output
        run: echo "The light report ${{ steps.ptt.outputs.result }}"
  test_deep_scan:
    runs-on: ubuntu-latest
    name: Run a manual deep scan. You will need a suitable API key
    # Disabled: the deep scan needs a paid API key and failed on every push. To bring it back, restore the condition
    # (github.event_name == 'push' || github.event_name == 'workflow_dispatch') and set the PTT_API_KEY secret.
    if: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Actual PTT deep test
        uses: pentesttoolscom/pentesttools-github-action@ece54ee3353e11194715688b9af3b708801fa3f6 # master on 2026-02-03
        id: ptt
        with:
          target: ${{ inputs.url || 'https://resurse.dev' }}
          format: text
          fail: medium
          type: deep
          key: ${{ secrets.PTT_API_KEY }}
      - name: Check the deep output
        run: echo "The deep report ${{ steps.ptt.outputs.result }}"
