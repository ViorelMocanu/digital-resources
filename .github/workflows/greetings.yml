name: Greetings

# Thanks a person for their first issue. Only an opened issue starts it: from 2 December 2026 GitHub blocks
# pull_request_target in public repositories unless an Actions policy allows it, so pull requests are not greeted.
on:
    issues:
        types: [opened]

jobs:
    greeting:
        runs-on: ubuntu-latest
        permissions:
            issues: write
            # When the opener already has an earlier issue, the action lists the pull requests before it skips.
            pull-requests: read
        steps:
            - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
              with:
                  issue_message: 'Viorel thanks you for contributing your first issue! :)'
                  # The action asks for both messages on every run, though only issues start this workflow.
                  pr_message: 'Viorel thanks you for contributing your first Pull Request! :)'
