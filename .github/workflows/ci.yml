# The gate for every push and pull request: the fast checks, the build, the browser tests of the built site
# (navigation, smoke, accessibility) and the comparison with the committed reference screenshots.
#
# Every action is pinned to a commit; the comment after it names the release. Dependabot proposes the updates.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_screenshots:
        description: Take new reference screenshots instead of comparing (download them from the run, then commit them)
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks, build and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm, the version named in package.json
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node, the version named in .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install exactly what is locked, without install scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint, types, unit tests, generated files, format
        run: pnpm verify

      - name: Known vulnerabilities in what the site ships
        run: pnpm audit --prod

      - name: Build
        run: pnpm build

      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests (navigation, smoke, accessibility)
        run: pnpm test:e2e

      # The references are taken on this runner and nowhere else, so a difference is a difference in the site.
      # With no references in the repository, or when asked, the step takes them and compares nothing.
      - name: Screenshots against the committed references
        id: shots
        env:
          E2E_SHOTS: '1'
          UPDATE: ${{ inputs.update_screenshots }}
        run: |
          if [ "$UPDATE" = "true" ] || ! ls e2e/__screenshots__/*/*.png > /dev/null 2>&1; then
            echo "::warning::No comparison was made: reference screenshots were taken. Download the artifact reference-screenshots from this run, put its folders in e2e/__screenshots__/ and commit them."
            pnpm exec playwright test shots --update-snapshots
            echo "taken=true" >> "$GITHUB_OUTPUT"
          else
            pnpm exec playwright test shots
          fi

      - name: Keep the new reference screenshots
        if: steps.shots.outputs.taken == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference-screenshots
          path: e2e/__screenshots__/
          if-no-files-found: error
          retention-days: 14

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
