# pnpm settings for this repository. It is a single package, not a workspace.

# A release must be seven days old (in minutes) before pnpm resolves to it, so a bad or hijacked release has time
# to be noticed and withdrawn. This applies when a version is chosen; a locked install is not affected.
minimumReleaseAge: 10080

overrides:
    # The plugin lists one exact, old Astro as its own dependency, which installed a second, vulnerable copy of Astro
    # and of everything under it. The plugin is one component file; it works with the site's Astro.
    'astro-simpleanalytics-plugin>astro': '$astro'
    # The file tracer of the Vercel adapter asks for glob 13, and every glob below 14.0.2 (with the minimatch 10 it
    # brings) has an open advisory. glob 14 brings minimatch 11. A static build never runs the tracer; the override
    # only keeps the vulnerable versions out of the install. Remove when @vercel/nft asks for glob 14 itself.
    '@vercel/nft>glob': '^14.0.2'
    # rollup arrives only as a peer of a helper under the same tracer, and the lockfile held it at 4.24.0, below the
    # fix for an open advisory (4.59.0). An update inside the range did not move it; this does. The site itself is
    # not built with rollup.
    'rollup@<4.59.0': '^4.59.0'
    # The three below close the last advisories among the development tools. None of these packages reaches the
    # site. Each parent pins or caps a version that has an advisory; remove a line when its parent catches up.
    # markdownlint (under markdownlint-cli 0.50.0) pins re2js 2.8.6 exactly; the fix is the next patch.
    'markdownlint>re2js': '2.8.7'
    # micromark-extension-math (under markdownlint) caps katex below the fixed 0.18.2. The linter reads the math
    # syntax and never renders it.
    'micromark-extension-math>katex': '^0.18.2'
    # Four development tools ask for minimatch 10; the fix is in 11.0.1. Each is named, so the override reaches no
    # other package. Checked after the change: eslint lints the same 77 files with the same result.
    'eslint>minimatch': '^11.0.1'
    '@eslint/config-array>minimatch': '^11.0.1'
    '@typescript-eslint/typescript-estree>minimatch': '^11.0.1'
    'markdownlint-cli>minimatch': '^11.0.1'

packageExtensions:
    # This package (under @astrojs/check) ships @emnapi/core 1.11.3 but leaves the matching runtime to a peer that
    # also accepts 2.0 prereleases. pnpm picked a prerelease, the two halves did not fit, and `astro check` crashed
    # on start. Giving the package its runtime directly fixes that. Remove when @astrojs/check brings a later version.
    '@astrojs/astro2tsx@0.1.3':
        dependencies:
            '@emnapi/runtime': 1.11.3
